<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso · Vaelo</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0e2463">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=20261109b">
</head>
<body class="acceso-admin">
  <main class="acceso">
    <form class="tarjeta-acceso" id="form" novalidate>
      <img src="/img/logo-negro.png" alt="Vaelo" class="logo-acceso" width="139" height="40" onerror="logoRespaldo(this)">
      <h1>Administración</h1>
      <p style="color:var(--suave)">Acceso exclusivo para la administración de Vaelo.</p>
      <div id="msg" class="mensaje" role="alert"></div>
      <div class="campo"><label for="email">Correo</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="campo"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="boton" type="submit">Entrar</button>
    </form>
  </main>
  <script src="/js/comun.js?v=20261109b"></script>
  <script>
    const form = document.getElementById('form');
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const boton = form.querySelector('button');
      boton.disabled = true;
      try {
        await api('/api/acceso-familia', { body: { email: form.email.value, password: form.password.value } });
        location.reload();
      } catch (e) {
        mostrarMensaje(document.getElementById('msg'), e.message);
        form.password.value = '';
        boton.disabled = false;
      }
    });
  </script>
</body>
</html>
