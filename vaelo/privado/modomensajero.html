<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modo mensajero · Vaelo</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0e2463">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest-piloto.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css?v=4.7.1">
  <link rel="stylesheet" href="/css/styles.css?v=20261111g">
  <link rel="stylesheet" href="/css/suave.css?v=20261111a">
</head>
<body class="modo-piloto app-piloto">
  <header class="barra"><div class="contenedor">
    <a href="/modomensajero" class="marca"><img src="/img/logo-blanco.png" alt="Vaelo" width="139" height="40"></a>
    <nav class="nav" id="nav"><span class="etiqueta-modo">Modo mensajero</span></nav>
  </div></header>
  <main class="area"><div class="contenedor" style="max-width:760px" id="app"><p class="pista">Cargando…</p></div></main>
  <button class="boton-emergencia" type="button" id="boton-emergencia" hidden>Emergencia</button>
  <dialog id="dlg-p"><div class="dialogo" id="dlg-p-cuerpo"></div></dialog>

  <script src="/vendor/maplibre/maplibre-gl.js?v=4.7.1"></script>
  <script src="/js/comun.js?v=20261109c"></script>
  <script src="/js/suave.js?v=20261111a"></script>
  <script src="/js/qr.js?v=1"></script>
  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);
    const app = $('app');
    // Si la foto de un paquete no carga, se muestra un recuadro limpio en vez del ícono roto
    document.addEventListener('error', (ev) => { const i = ev.target; if (i.tagName === 'IMG' && i.closest('.foto-lleva') && !i.dataset.fallo) { i.dataset.fallo = '1'; i.replaceWith(el('div', { class: 'foto-sin', text: 'Sin foto' })); } }, true);
    const CAMPOS_APROBADO = ['telefono', 'direccion', 'emergencia_nombre', 'emergencia_parentesco', 'emergencia_telefono', 'nit',
      'penales_fecha', 'policiacos_fecha', 'licencia_numero', 'licencia_tipo', 'licencia_vence', 'seguro_aseguradora', 'seguro_vence'];
    const DOCS_RENOVABLES = ['recibo', 'penales', 'policiacos', 'licencia_frente', 'licencia_reverso'];
    const REGLAS = [
      'Mantener la ubicación (GPS) del teléfono encendida mientras estés en línea y durante cada entrega. Vaelo guarda el recorrido para tu seguridad y la del paquete.',
      'Usar casco y el equipo de Vaelo, y respetar las leyes de tránsito.',
      'No abrir, cambiar ni dejar los paquetes con personas que no sean el destinatario o quien él indique.',
      'Cobrar solo los montos que indica la aplicación y entregar el dinero según las indicaciones de la administración.',
      'Tratar con respeto a clientes y destinatarios.',
      'Avisar de inmediato a la administración ante un accidente, robo o cualquier problema en la ruta.',
      'Mantener vigentes tu licencia y tus antecedentes. Con un documento vencido no podrás recibir envíos.',
    ];
    // Lo más importante de la política (la completa está en /politica-pilotos)
    const RESUMEN_POLITICA = [
      'De cada envío Vaelo cobra Q5; el resto es para ti.',
      'Todo el efectivo y los cobros contra entrega se entregan en la sede. Si pasa el plazo sin aclarar cuentas, no podrás conectarte y se puede suspender tu cuenta.',
      'Si un paquete se pierde o se daña por descuido, te haces responsable: se evalúa y se descuenta de tu pago.',
      'Respeta la Ley de Tránsito: casco, velocidad, semáforos y nada de teléfono en la mano al manejar. Las multas son tuyas.',
      'Tus documentos y datos se piden para tu seguridad, la de los clientes y la de Vaelo.',
      'Tu ubicación se comparte mientras estás en línea o llevas un envío.',
      'Vaelo puede suspender tu cuenta por quedarte con dinero o paquetes, faltas graves de tránsito, documentos falsos o malos tratos.',
    ];
    let yo = null, vehiculos = [], vigencia = 6;
    let enLinea = false, vigilante = null, ultimaPos = null, ultimaLectura = 0, ultimoEnvio = 0, gpsError = '';
    let conocidos = null, bloqueoPantalla = null, temporizador = null, envios = [], ultimaFirma = '', ocupado = 0;

    function barra(conSesion) {
      poner($('nav'), el('span', { class: 'etiqueta-modo', text: 'Modo mensajero' }));
      if (conSesion) $('nav').append(el('button', { class: 'enlace', type: 'button', text: 'Salir', onclick: async () => {
        if (hayEntregaActiva() && !confirm('Tienes entregas en curso. Si sales, dejarás de compartir tu ubicación. ¿Salir de todas formas?')) return;
        detenerGps();
        try { await api('/api/logout', { body: {} }); } catch { /* igual */ }
        location.reload();
      } }));
    }

    async function iniciar() {
      clearInterval(temporizador);
      try {
        const r = await api('/api/piloto/yo');
        yo = r.piloto; vehiculos = r.vehiculos; vigencia = r.vigencia_antecedentes;
      } catch (e) {
        if (e.status === 401 || e.status === 403) return pintarAcceso();
        poner(app, el('div', { class: 'mensaje error', text: e.message })); return;
      }
      barra(true);
      if (yo.estado_piloto === 'aprobado') return pintarTrabajo();
      if (yo.estado_piloto === 'en_revision') return pintarSolicitud();
      poner(app, el('div', { class: 'bloque' }, el('h1', { style: 'font-size:1.8rem', text: 'Tu cuenta está suspendida' }),
        el('p', { text: 'No puedes recibir envíos por ahora. Comunícate con la administración de Vaelo.' })));
    }

    // ---------- Entrar o registrarse ----------
    function pintarAcceso() {
      barra(false);
      const msg = el('div', { class: 'mensaje', role: 'alert' });
      const panelEntrar = el('form', { class: 'tarjeta-acceso', novalidate: true },
        el('h1', { text: 'Entrar' }), el('p', { style: 'color:var(--suave)', text: 'Para pilotos de Vaelo.' }), msg,
        el('div', { class: 'campo' }, el('label', { for: 'e-email', text: 'Correo' }), el('input', { id: 'e-email', type: 'email', autocomplete: 'username', required: true })),
        el('div', { class: 'campo' }, el('label', { for: 'e-pass', text: 'Contraseña' }), el('input', { id: 'e-pass', type: 'password', autocomplete: 'current-password', required: true })),
        el('button', { class: 'boton', type: 'submit', text: 'Entrar' }),
        el('p', { class: 'alterno' }, el('a', { href: '/recuperar', text: '¿Olvidaste tu contraseña?' })),
        el('p', { class: 'alterno' }, '¿Quieres trabajar con nosotros? ', el('a', { href: '#registro', onclick: (ev) => { ev.preventDefault(); verRegistro(); }, text: 'Envía tu solicitud' })));
      panelEntrar.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const b = panelEntrar.querySelector('button'); b.disabled = true;
        try { await api('/api/piloto/entrar', { body: { email: $('e-email').value, password: $('e-pass').value } }); iniciar(); }
        catch (e) { mostrarMensaje(msg, e.message); b.disabled = false; }
      });

      const msg2 = el('div', { class: 'mensaje', role: 'alert' });
      const acepto = el('input', { type: 'checkbox', id: 'r-reglas', style: 'width:auto' });
      const panelRegistro = el('form', { class: 'tarjeta-acceso ancha', novalidate: true, hidden: true },
        el('h1', { text: 'Quiero ser piloto' }),
        el('p', { style: 'color:var(--suave)', text: 'Crea tu cuenta y luego sube tus documentos. La administración revisa cada solicitud antes de aprobarla.' }), msg2,
        el('div', { class: 'campo' }, el('label', { for: 'r-nombre', text: 'Nombre completo (como aparece en tu DPI)' }), el('input', { id: 'r-nombre', autocomplete: 'name', maxlength: 100 })),
        el('div', { class: 'campo' }, el('label', { for: 'r-tel', text: 'Teléfono o WhatsApp' }), el('input', { id: 'r-tel', type: 'tel', autocomplete: 'tel', placeholder: '0000-0000', maxlength: 30 })),
        el('div', { class: 'campo' }, el('label', { for: 'r-email', text: 'Correo' }), el('input', { id: 'r-email', type: 'email', autocomplete: 'email', maxlength: 150 })),
        el('div', { class: 'campo' }, el('label', { for: 'r-pass' }, 'Contraseña ', el('span', { class: 'ayuda', text: 'Mínimo 8 caracteres' })), el('input', { id: 'r-pass', type: 'password', autocomplete: 'new-password' })),
        el('details', { class: 'reglas' }, el('summary', { text: 'Resumen de la política para pilotos' }), el('ul', {}, RESUMEN_POLITICA.map(t => el('li', { text: t })))),
        el('label', { class: 'casilla', for: 'r-reglas' }, acepto, el('span', {}, 'Leí y acepto la ', el('a', { href: '/politica-pilotos', target: '_blank', text: 'política y condiciones para pilotos' }))),
        el('button', { class: 'boton', type: 'submit', text: 'Crear mi cuenta' }),
        el('p', { class: 'alterno' }, '¿Ya tienes cuenta? ', el('a', { href: '#entrar', onclick: (ev) => { ev.preventDefault(); verEntrar(); }, text: 'Entra aquí' })));
      panelRegistro.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        if (!acepto.checked) { mostrarMensaje(msg2, 'Para continuar tienes que aceptar las reglas.'); return; }
        const b = panelRegistro.querySelector('button[type=submit]'); b.disabled = true;
        try {
          await api('/api/piloto/registro', { body: { nombre: $('r-nombre').value, telefono: $('r-tel').value, email: $('r-email').value, password: $('r-pass').value } });
          await api('/api/piloto/perfil', { method: 'PUT', body: { acepto_reglas: true, acepto_politica: true } });
          iniciar();
        } catch (e) { mostrarMensaje(msg2, e.message); b.disabled = false; }
      });
      const verRegistro = () => { panelEntrar.hidden = true; panelRegistro.hidden = false; history.replaceState(null, '', '#registro'); };
      const verEntrar = () => { panelEntrar.hidden = false; panelRegistro.hidden = true; history.replaceState(null, '', location.pathname); };
      poner(app, bloqueInstalar('Vaelo Pilotos'), el('div', { class: 'acceso-piloto' }, panelEntrar, panelRegistro));
      if (location.hash === '#registro') verRegistro();
    }

    // ---------- Formulario de perfil (solicitud y "Mi perfil"), por secciones con avance ----------
    function formularioPerfil(aprobado, alGuardar) {
      const msg = el('div', { class: 'mensaje', role: 'alert' });
      const campos = {};
      const bloqueado = (k) => aprobado && !CAMPOS_APROBADO.includes(k);
      const valor = (k) => (campos[k] && !campos[k].disabled ? campos[k].value : yo[k]);
      const entrada = (k, titulo, attrs = {}, ayuda) => {
        const id = 'p-' + k;
        const input = attrs.tag === 'select'
          ? el('select', { id }, attrs.opciones.map(([v, t]) => el('option', { value: v, text: t, selected: String(yo[k] ?? '') === String(v) })))
          : attrs.tag === 'textarea' ? el('textarea', { id, maxlength: attrs.maxlength || 800, rows: 3 }) : el('input', { id, ...attrs });
        if (attrs.tag === 'textarea') input.value = yo[k] || '';
        else if (attrs.tag !== 'select') input.value = k === 'dpi' && yo[k] ? `${yo[k].slice(0, 4)} ${yo[k].slice(4, 9)} ${yo[k].slice(9)}` : (yo[k] ?? '');
        if (bloqueado(k)) input.disabled = true;
        input.addEventListener('input', pintarAvance);
        campos[k] = input;
        return el('div', { class: 'campo' }, el('label', { for: id }, titulo, ayuda ? el('span', { class: 'ayuda', text: ' ' + ayuda }) : null), input);
      };
      const doc = (tipo, titulo, op = {}) => campoDocumento({ titulo, tiene: yo.docs[tipo], ver: `/api/piloto/documento/${tipo}`, pdf: op.pdf, ayuda: op.ayuda, camara: op.camara,
        soloVer: aprobado && !DOCS_RENOVABLES.includes(tipo),
        subir: (archivo) => api('/api/piloto/documento', { body: { tipo, archivo } }), alCambiar: async () => { await refrescar(); pintarAvance(); } });
      const fila = (...h) => el('div', { class: 'fila' }, ...h);
      const docs = (...h) => el('div', { class: 'docs' }, ...h);
      const hoy = new Date().toISOString().slice(0, 10);
      // Qué pide cada sección para estar completa
      const SECCIONES = [
        { id: 'datos', titulo: 'Tus datos', icono: 'usuario', texto: 'Como aparecen en tu DPI. Tu foto la ve el cliente cuando llevas su paquete.',
          ok: () => valor('nombre') && valor('fecha_nacimiento') && String(valor('dpi') || '').replace(/\D/g, '').length === 13 && valor('direccion') && yo.docs.foto && yo.docs.dpi_frente && yo.docs.dpi_reverso },
        { id: 'emergencia', titulo: 'Contacto de emergencia', icono: 'alerta', texto: 'A quién llamamos si te pasa algo en la ruta.', ok: () => valor('emergencia_nombre') && valor('emergencia_telefono') },
        { id: 'antecedentes', titulo: 'Antecedentes', icono: 'check', texto: `Penales y policiacos. Valen ${vigencia} meses desde su emisión.`,
          ok: () => valor('penales_fecha') && valor('policiacos_fecha') && yo.docs.penales && yo.docs.policiacos },
        { id: 'licencia', titulo: 'Licencia', icono: 'etiqueta', texto: 'Con la licencia vencida no puedes recibir envíos.', ok: () => valor('licencia_numero') && valor('licencia_tipo') && valor('licencia_vence') && yo.docs.licencia_frente },
        { id: 'vehiculo', titulo: 'Tu vehículo', icono: 'piloto', texto: 'Con el que haces las entregas.',
          ok: () => valor('vehiculo_id') && valor('veh_placa') && valor('veh_marca') && valor('veh_modelo') && valor('veh_color') && yo.docs.tarjeta && yo.docs.veh_frente && (String(valor('veh_propio')) === '1' || yo.docs.carta) },
        { id: 'seguro', titulo: 'Seguro', icono: 'check', texto: 'Opcional, pero recomendado.', ok: () => true, opcional: true },
      ];
      const chips = {}, marcas = {};
      const nav = el('nav', { class: 'perfil-pasos', 'aria-label': 'Secciones del perfil' }, SECCIONES.map(x => (chips[x.id] = el('button', { type: 'button',
        onclick: () => { const sec = document.getElementById('sec-' + x.id); sec.classList.add('abierta'); sec.querySelector('.seccion-cab')?.setAttribute('aria-expanded', 'true'); sec.scrollIntoView({ behavior: sinAnimacion() ? 'auto' : 'smooth', block: 'start' }); } }, el('span', { class: 'marca-paso' }), x.titulo))));
      const anillo = el('div', { class: 'anillo' }, el('span'));
      const avanceTexto = el('div');
      const avance = el('div', { class: 'perfil-avance' }, anillo, avanceTexto);
      function pintarAvance() {
        const req = SECCIONES.filter(x => !x.opcional);
        const listas = req.filter(x => x.ok()).length;
        const pct = Math.round((listas / req.length) * 100);
        anillo.style.setProperty('--p', pct); anillo.firstChild.textContent = pct + '%';
        poner(avanceTexto, el('strong', { text: pct === 100 ? 'Tu perfil está completo' : `Te faltan ${req.length - listas} de ${req.length} secciones` }),
          el('small', { text: aprobado ? 'Mantén al día tu licencia y tus antecedentes.' : 'Guarda y vuelve cuando quieras. La administración revisa tu solicitud cuando esté completa.' }));
        for (const x of SECCIONES) {
          const ok = !!x.ok();
          chips[x.id].classList.toggle('completo', ok && !x.opcional);
          marcas[x.id] && marcas[x.id].replaceChildren(el('span', { class: x.opcional ? 'etiqueta-gris' : ok ? 'etiqueta-completa' : 'etiqueta-pendiente', text: x.opcional ? 'Opcional' : ok ? 'Completo' : 'Falta' }));
        }
        pintarLicencia(); pintarVencimientos();
      }
      const seccion = (id, ...hijos) => {
        const x = SECCIONES.find(z => z.id === id);
        marcas[id] = el('span', { class: 'estado-seccion' });
        // Ya aprobado: cada sección se pliega (se abre tocando su título) para que el perfil no sea una página eterna
        const cab = el('div', { class: 'seccion-cab', ...(aprobado ? { role: 'button', tabindex: '0', 'aria-expanded': 'false', onclick: (ev) => alternar(ev.currentTarget), onkeydown: (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); alternar(ev.currentTarget); } } } : {}) },
          el('span', { class: 'num' }, icono(x.icono)), el('div', {}, el('h2', { text: x.titulo }), el('p', { class: 'pista', text: x.texto })), marcas[id]);
        return el('fieldset', { class: 'perfil-seccion' + (aprobado ? ' plegable' : ''), id: 'sec-' + id }, el('legend', { class: 'oculto', text: x.titulo }),
          cab, aprobado ? el('div', { class: 'seccion-cuerpo' }, ...hijos) : hijos);
      };
      const alternar = (cab) => { const f = cab.closest('.perfil-seccion'); const abierta = f.classList.toggle('abierta'); cab.setAttribute('aria-expanded', String(abierta)); };
      // Vista de la licencia y vencimientos de antecedentes, se actualizan mientras escribes
      const tarjetaLic = el('div', { class: 'licencia-tarjeta' });
      const chipVence = (f, dias = 30) => {
        if (!f) return el('span', { class: 'vence-chip', text: 'Sin fecha' });
        const hoyD = new Date(hoy + 'T00:00:00'), d = new Date(f + 'T00:00:00');
        if (d < hoyD) return el('span', { class: 'vence-chip mal', text: 'Vencida' });
        if ((d - hoyD) / 86400e3 <= dias) return el('span', { class: 'vence-chip pronto', text: 'Vence pronto' });
        return el('span', { class: 'vence-chip', text: 'Vigente' });
      };
      function pintarLicencia() {
        const v = valor('licencia_vence');
        poner(tarjetaLic, el('small', { text: 'Licencia de conducir · República de Guatemala' }),
          el('div', { class: 'lic-num', text: valor('licencia_numero') || '—' }),
          el('div', { class: 'lic-fila' },
            el('div', {}, el('small', { text: 'Tipo' }), el('strong', { text: valor('licencia_tipo') || '—' })),
            el('div', {}, el('small', { text: 'Vence' }), el('strong', { text: v ? new Date(v + 'T12:00:00').toLocaleDateString('es-GT', { day: 'numeric', month: 'short', year: 'numeric' }) : '—' })),
            el('div', {}, el('small', { text: 'Estado' }), chipVence(v))),
          el('small', { style: 'margin-top:.5rem', text: yo.nombre }));
      }
      const venceAnt = el('div', { class: 'lic-fila', style: 'color:var(--tinta);margin-bottom:.75rem' });
      function pintarVencimientos() {
        const vence = (f) => { if (!f) return ''; const d = new Date(f + 'T12:00:00'); d.setMonth(d.getMonth() + vigencia); return d.toISOString().slice(0, 10); };
        poner(venceAnt, ...[['Penales', valor('penales_fecha')], ['Policiacos', valor('policiacos_fecha')]].map(([t, f]) =>
          el('div', {}, el('small', { class: 'mini', text: `${t} vencen` }), el('strong', { text: f ? new Date(vence(f) + 'T12:00:00').toLocaleDateString('es-GT', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' : '— ' }), f ? chipVence(vence(f)) : null)));
      }

      const guardar = el('button', { class: 'boton', type: 'submit', text: 'Guardar mis datos' });
      const form = el('form', { novalidate: true },
        avance, nav,
        aprobado ? el('p', { class: 'mensaje aviso', text: 'Ya estás aprobado: puedes actualizar tu contacto y renovar licencia y antecedentes. Cuando renuevas, la oficina revisa que la fecha coincida con la foto; mientras tanto sigue valiendo la anterior. Para cambiar otros datos (nombre, DPI, vehículo), comunícate con la administración.' }) : null,
        aprobado && yo.renovacion ? el('div', { class: 'mensaje aviso' }, el('strong', { text: 'Renovación en revisión. ' }), 'La oficina está confirmando tus documentos nuevos.') : null,
        seccion('datos',
          fila(entrada('nombre', 'Nombre completo', { maxlength: 100, autocomplete: 'name' }), entrada('telefono', 'Teléfono', { type: 'tel', maxlength: 30 })),
          fila(entrada('fecha_nacimiento', 'Fecha de nacimiento', { type: 'date', max: hoy }), entrada('dpi', 'Número de DPI', { inputmode: 'numeric', maxlength: 17, placeholder: '0000 00000 0000' })),
          entrada('direccion', 'Dirección donde vives', { maxlength: 300, placeholder: 'Calle, número, zona, municipio' }),
          fila(entrada('nit', 'NIT', { maxlength: 20 }, 'Opcional'), el('div')),
          entrada('referencias', 'Referencias personales o de trabajo', { tag: 'textarea' }, 'Opcional. Nombre y teléfono'),
          docs(doc('foto', 'Tu foto', { camara: 'user', ayuda: 'De frente, sin lentes oscuros ni gorra.' }),
            doc('dpi_frente', 'DPI (frente)', { camara: 'environment' }), doc('dpi_reverso', 'DPI (reverso)', { camara: 'environment' }),
            doc('recibo', 'Recibo de luz o agua', { pdf: true, ayuda: 'Opcional. Comprueba tu dirección' }))),
        seccion('emergencia',
          fila(entrada('emergencia_nombre', 'Nombre', { maxlength: 100 }), entrada('emergencia_parentesco', 'Parentesco', { maxlength: 50, placeholder: 'Mamá, esposa, hermano…' })),
          fila(entrada('emergencia_telefono', 'Teléfono', { type: 'tel', maxlength: 30 }), el('div'))),
        seccion('antecedentes', venceAnt,
          fila(entrada('penales_fecha', 'Emisión de antecedentes penales', { type: 'date', max: hoy }), entrada('policiacos_fecha', 'Emisión de antecedentes policiacos', { type: 'date', max: hoy })),
          docs(doc('penales', 'Antecedentes penales', { pdf: true }), doc('policiacos', 'Antecedentes policiacos', { pdf: true }))),
        seccion('licencia', tarjetaLic,
          fila(entrada('licencia_numero', 'Número de licencia', { maxlength: 30 }),
            entrada('licencia_tipo', 'Tipo', { tag: 'select', opciones: [['', 'Elige'], ['M', 'M (moto)'], ['C', 'C'], ['B', 'B'], ['A', 'A']] })),
          fila(entrada('licencia_vence', 'Fecha de vencimiento', { type: 'date' }), el('div')),
          docs(doc('licencia_frente', 'Licencia (frente)', { camara: 'environment' }), doc('licencia_reverso', 'Licencia (reverso)', { camara: 'environment', ayuda: 'Recomendada' }))),
        seccion('vehiculo',
          fila(entrada('vehiculo_id', 'Tipo de vehículo', { tag: 'select', opciones: [['', 'Elige'], ...vehiculos.map(v => [v.id, v.nombre])] }),
            entrada('veh_placa', 'Placa', { maxlength: 12, placeholder: 'M-123ABC', style: 'text-transform:uppercase' })),

        { enableHighAccuracy: alta, timeout: espera, maximumAge: 15000 }));
      // GPS primero; si tarda (bajo techo), la ubicación aproximada del teléfono; si tampoco, la última lectura reciente del GPS
      return pedir(true, 10000).catch((err) => err.code === 1 ? Promise.reject(err) : pedir(false, 8000)).catch((err) => {

    async function conectar(boton) {

    async function desconectar(boton, voyASede = false) {

    }

    // GPS: se envía la ubicación cada 15 segundos mientras estás en línea o llevando un envío
    function iniciarGps() {
      if (vigilante != null || !navigator.geolocation) return;
      vigilante = navigator.geolocation.watchPosition((p) => {
        ultimaPos = { lat: p.coords.latitude, lng: p.coords.longitude, precision: p.coords.accuracy }; ultimaLectura = Date.now(); gpsError = '';

    function kmHasta(lat, lng) {

    // Llamar o escribir por WhatsApp: va debajo de los botones para llegar, separado para no confundir

      const deFoco = lista.filter(x => x.tarifa_foco), normales = lista.filter(x => !x.tarifa_foco);
      const ganaDe = (l) => l.reduce((t, x) => t + (x.ganancia_piloto || 0), 0);
      const avisoFoco = deFoco.length ? el('div', { class: 'ruta-foco' },
        el('strong', { text: normales.length ? `Ruta mixta minorista: ${deFoco.length} de zona foco y ${normales.length} normal${normales.length === 1 ? '' : 'es'}` : `Ruta minorista de zona foco: ${deFoco.length} entrega${deFoco.length === 1 ? '' : 's'} en ${deFoco[0].destino_zona}` }),
        `No es una entrega normal: en zona foco ganas ${dinero(deFoco[0].ganancia_piloto || 0)} por entrega porque casi no manejas.${normales.length ? ` Las ${normales.length} de otras zonas pagan normal.` : ''} En total ganas ${dinero(ganaDe(lista))}.`) : null;

          el('div', { class: 'parada' }, el('span', { text: 'Recoger en' }), [e0.origen_zona, e0.origen_direccion].filter(Boolean).join('. '), km != null ? el('div', { class: 'pista', text: `A ${km.toFixed(1)} km de ti` }) : null),

            el('button', { class: 'boton cinta accion-principal', type: 'button', text: 'Aceptar ruta', onclick: async (ev) => {
              const b = ev.target; b.disabled = true; b.textContent = 'Revisando tu ubicación…'; ocupado++;

    function rutaSugerida() {
      const activos = envios.filter(e => e.asignacion === 'aceptado' && !e.pedido_id && ['pendiente', 'recogido', 'en_camino', 'devolviendo'].includes(e.estado));
      if (activos.length < 2 || !ultimaPos) return '';
      // Con una ruta de empresa en curso manda el orden de la ruta: los sueltos se hacen cuando queden de paso
      if (envios.some(e => e.pedido_id && e.asignacion === 'aceptado' && ['pendiente', 'recogido', 'en_camino'].includes(e.estado)))
        return el('div', { class: 'mensaje aviso' }, el('strong', { text: `Tienes una ruta de empresa y ${activos.length} envíos sueltos. ` }), 'Sigue el orden de tu ruta y haz los sueltos cuando te queden de paso. Cada paquete tiene su recuadro BUSCA.');
      const paradas = [];
      for (const e of activos) {
        if (e.estado === 'devolviendo') { if (e.origen_lat != null) paradas.push({ tipo: 'Devolver', e, lat: e.origen_lat, lng: e.origen_lng }); continue; }
        if (e.estado === 'pendiente' && e.origen_lat != null) paradas.push({ tipo: 'Recoger', e, lat: e.origen_lat, lng: e.origen_lng });
        if (e.destino_lat != null) paradas.push({ tipo: 'Entregar', e, lat: e.destino_lat, lng: e.destino_lng });
      }
      const orden = []; let actual = ultimaPos;
      const dist = (a, b) => Math.hypot(a.lat - b.lat, (a.lng - b.lng) * Math.cos(a.lat * Math.PI / 180));
      while (paradas.length) {
        const posibles = paradas.filter(p => p.tipo === 'Recoger' || !paradas.some(q => q.tipo === 'Recoger' && q.e.id === p.e.id));
        posibles.sort((a, b) => dist(actual, a) - dist(actual, b));
        const sig = posibles[0]; orden.push(sig); paradas.splice(paradas.indexOf(sig), 1); actual = sig;
      }
      const ultimo = orden[orden.length - 1];
      const url = `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${ultimo.lat},${ultimo.lng}` +
        (orden.length > 1 ? '&waypoints=' + encodeURIComponent(orden.slice(0, -1).map(p => `${p.lat},${p.lng}`).join('|')) : '');
      return el('div', { class: 'bloque ruta-sugerida' }, el('h2', { text: 'Ruta sugerida' }),
        el('ol', {}, orden.map(p => el('li', {}, el('strong', { text: p.tipo + ' ' }), valorBusca(p.e), p.tipo === 'Entregar' ? `${p.e.destino_nombre} · ${p.e.destino_zona}` : `${p.e.origen_zona}`))),
        el('a', { class: 'boton chico', href: url, target: '_blank', rel: 'noopener', text: 'Abrir ruta completa en Google Maps' }));
    }

        e.flete ? null : cajaBusca(e, 'entregar'), msg,
        Number(e.cobro_destinatario) > 0 ? el('div', { class: 'cobro', text: `Antes de entregar, cobra ${dinero(cobroParada(e))}${e.metodo_pago === 'recibe' ? ` (${dinero(e.precio)} del envío + ${dinero(e.cobro_destinatario)} del producto)` : ' del producto'}` }) : '',
        el('div', { class: 'campo' }, el('label', { for: 'en-codigo', text: 'Código de entrega (te lo da quien recibe)' }), codigo),
        el('div', { class: 'campo' }, el('label', { for: 'en-recibio', text: '¿Quién recibió?' }), recibio),
        el('div', { class: 'foto-paquete foto-paquete-chica foto-entrega' }, el('label', { class: 'foto-paquete-boton', for: 'en-foto' }, vista, vacioFoto, foto)),
        el('div', { class: 'campo' }, el('span', { class: 'etiqueta-campo', text: 'Firma de quien recibe (opcional)' }), lienzo,
          el('button', { class: 'boton borde chico', type: 'button', text: 'Borrar firma', onclick: () => { ctx.clearRect(0, 0, lienzo.width, lienzo.height); firmado = false; } })),
        boton);
      $('dlg-p').showModal();
    }

    // ---------- Botón de emergencia ----------
    $('boton-emergencia').addEventListener('click', () => {
      const msg = el('div', { class: 'mensaje', role: 'alert' });
      const enviar = (tipo) => async () => {
        let pos = ultimaPos;
        try { pos = await posicionFresca(); } catch { /* se manda la última */ }
        try {
          await api('/api/piloto/emergencia', { body: { tipo, ...(pos || {}) } });
          if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
          poner($('dlg-p-cuerpo'), el('button', { class: 'cerrar', type: 'button', 'aria-label': 'Cerrar', text: '×', onclick: () => $('dlg-p').close() }),
            el('h2', { text: 'Avisamos a Vaelo' }), el('p', { text: 'La administración ya ve tu ubicación y te va a llamar. Si es grave, llama también:' }), llamadas());
        } catch (err) { mostrarMensaje(msg, err.message + ' Llama directo a Vaelo o a emergencias.'); }
      };
      const llamadas = () => el('div', { class: 'llamadas' },
        el('a', { class: 'boton peligro', href: 'tel:110', text: 'Policía (110)' }),
        el('a', { class: 'boton peligro', href: 'tel:122', text: 'Bomberos Voluntarios (122)' }),
        el('a', { class: 'boton peligro', href: 'tel:123', text: 'Bomberos Municipales (123)' }));
      poner($('dlg-p-cuerpo'), 
        el('button', { class: 'cerrar', type: 'button', 'aria-label': 'Cerrar', text: '×', onclick: () => $('dlg-p').close() }),
        el('h2', { style: 'font-size:1.5rem', text: '¿Qué pasó?' }),
        el('p', { text: 'Avisamos de inmediato a la administración con tu ubicación.' }), msg,
        el('div', { class: 'tipos-emergencia' },
          el('button', { class: 'boton peligro', type: 'button', text: 'Accidente', onclick: enviar('accidente') }),
          el('button', { class: 'boton peligro', type: 'button', text: 'Asalto o robo', onclick: enviar('asalto') }),
          el('button', { class: 'boton peligro', type: 'button', text: 'Problema de salud', onclick: enviar('salud') }),
          el('button', { class: 'boton peligro', type: 'button', text: 'Otra emergencia', onclick: enviar('otro') })),
        el('p', { class: 'pista', style: 'margin-top:1rem', text: 'Números de emergencia:' }), llamadas());
      $('dlg-p').showModal();
    });

    iniciar();
  </script>
</body>
</html>
