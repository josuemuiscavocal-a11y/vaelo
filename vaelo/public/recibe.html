<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Tu paquete Vaelo</title>
  <meta name="theme-color" content="#0e2463">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css?v=4.7.1">
  <link rel="stylesheet" href="/css/styles.css?v=20261109b">
</head>
<body>
  <header class="barra"><div class="contenedor"><a href="/" class="marca"><img src="/img/logo-blanco.png" alt="Vaelo" width="139" height="40"></a></div></header>
  <main class="recibe">
    <div class="contenedor">
      <div id="msg" class="mensaje" role="alert"></div>
      <div id="contenido" aria-live="polite"><p class="pista">Cargando tu envío…</p></div>
    </div>
  </main>
  <script src="/vendor/maplibre/maplibre-gl.js?v=4.7.1"></script>
  <script src="/js/comun.js?v=20261109c"></script>
  <script>
    // Página privada para quien recibe un paquete. Llega por el enlace que le manda quien envía.
    // 1) Confirma con una foto de su cara y su nombre. 2) Comparte su ubicación en vivo hasta que le entregan.
    const $ = (id) => document.getElementById(id);
    const TOKEN = location.pathname.split('/').pop();
    const API = '/api/recibe/' + TOKEN;
    const esEntrega = () => datos && datos.rol === 'entrega';

    let datos = null, fase = '', mapa = null, marcas = {}, reloj = null;
    let vigilancia = null, ultimaLectura = null, ultimoEnvio = 0, compartiendo = false, errorGps = '', candado = null;

    // ---------- Ubicación en vivo ----------
    const opcionesGps = { enableHighAccuracy: true, maximumAge: 5000, timeout: 30000 };
    function textoErrorGps(err) {
      if (err && err.code === 1) return 'Le negaste el permiso de ubicación a esta página. Actívalo en el candado junto a la dirección de la página (o en Ajustes del navegador) y toca "Compartir de nuevo".';
      if (err && err.code === 3) return 'Tu teléfono tardó en encontrar tu ubicación. Revisa que el GPS esté encendido.';
      return 'No pudimos leer tu ubicación. Enciende el GPS del teléfono.';
    }
    function leerUbicacion() {
      return new Promise((ok, mal) => {
        if (!navigator.geolocation) return mal(new Error('Este navegador no puede compartir tu ubicación. Abre el enlace en Chrome o Safari.'));
        navigator.geolocation.getCurrentPosition(
          (p) => ok({ lat: p.coords.latitude, lng: p.coords.longitude, precision: p.coords.accuracy }),
          (err) => mal(new Error(textoErrorGps(err))), opcionesGps);
      });
    }
    async function mandarUbicacion(forzar = false) {
      if (!ultimaLectura || (!forzar && Date.now() - ultimoEnvio < 10000)) return;
      ultimoEnvio = Date.now();
      try {
        const r = await api(API + '/ubicacion', { body: ultimaLectura });
        if (r.terminado) { detenerUbicacion(); cargar(); }
      } catch { /* se reintenta en la próxima lectura */ }
    }
    function iniciarUbicacion() {
      if (vigilancia != null || !navigator.geolocation) return;
      errorGps = '';
      vigilancia = navigator.geolocation.watchPosition((p) => {
        ultimaLectura = { lat: p.coords.latitude, lng: p.coords.longitude, precision: p.coords.accuracy };
        const antes = compartiendo; compartiendo = true; errorGps = '';
        if (!antes) pintarEstadoGps();
        moverMiPunto();
        mandarUbicacion(!antes);
      }, (err) => {
        errorGps = textoErrorGps(err);
        if (err.code === 1) { navigator.geolocation.clearWatch(vigilancia); vigilancia = null; compartiendo = false; }
        pintarEstadoGps();
      }, opcionesGps);
      // La pantalla no se apaga mientras esperas el paquete (si el teléfono lo permite)
      if ('wakeLock' in navigator && !candado) navigator.wakeLock.request('screen').then((c) => { candado = c; c.addEventListener('release', () => { candado = null; }); }).catch(() => {});
    }
    function detenerUbicacion() {
      if (vigilancia != null) navigator.geolocation.clearWatch(vigilancia);
      vigilancia = null; compartiendo = false;
      if (candado) candado.release().catch(() => {});
    }
    setInterval(() => mandarUbicacion(), 10000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible' || fase !== 'confirmado') return;
      iniciarUbicacion(); mandarUbicacion(true); cargar();
    });

    function pintarEstadoGps() {
      const caja = $('estado-gps');
      if (!caja) return;
      if (compartiendo) {
        caja.className = 'en-vivo';
        caja.replaceChildren(el('i'), el('span', { text: esEntrega() ? 'Estás compartiendo tu ubicación: el piloto viene a recoger a donde estás' : 'Estás compartiendo tu ubicación: el piloto te lleva el paquete a donde estás' }));
      } else {
        caja.className = 'en-vivo pausa';
        caja.replaceChildren(el('i'), el('span', { text: errorGps || 'Tu ubicación no se está compartiendo.' }),
          el('button', { class: 'boton chico', type: 'button', text: 'Compartir de nuevo', onclick: () => { detenerUbicacion(); iniciarUbicacion(); } }));
      }
    }

    // ---------- Mapa ----------
    function moverMiPunto() {
      if (!mapa || !ultimaLectura) return;
      if (marcas.yo) marcas.yo.mover(ultimaLectura.lat, ultimaLectura.lng);
      else {
        marcas.yo = mapa.marcador(ultimaLectura.lat, ultimaLectura.lng, { html: htmlReceptor(), ancla: 'center', popup: 'Tú' });
        const p = datos && datos.piloto;
        mapa.encuadrar([[ultimaLectura.lat, ultimaLectura.lng], p && p.lat != null ? [p.lat, p.lng] : null], { margen: 60 });
      }
    }
    function pintarPiloto(p) {
      if (!mapa) return;
      if (p && p.lat != null) {
        if (marcas.piloto) marcas.piloto.mover(p.lat, p.lng);
        else marcas.piloto = mapa.marcador(p.lat, p.lng, { html: htmlPiloto(), ancla: 'center', popup: `${p.nombre}, tu piloto` });
        const nota = $('nota-mapa'); if (nota) nota.textContent = 'Ubicación del piloto actualizada ' + fecha(p.actualizado);
      } else if (marcas.piloto) { marcas.piloto.quitar(); marcas.piloto = null; }
    }

    // ---------- Pantallas ----------
    function encabezado(r) {
      const nombre = (r.nombre_sugerido || '').split(' ')[0];
      if (r.rol === 'entrega') return [
        el('h1', { text: nombre ? `Hola, ${nombre}` : 'Hola' }),
        el('p', { style: 'font-size:1.05rem' }, 'Vaelo pasará a recoger contigo un paquete que ', el('strong', { text: r.remitente }), ` envía a ${r.destinatario.split(' ')[0]}. `, el('span', { class: 'pista', text: 'Guía ' + r.guia })),
      ];
      return [
        el('h1', { text: r.estado === 'entregado' ? 'Paquete entregado' : `Hola, ${nombre}` }),
        el('p', { style: 'font-size:1.05rem' }, el('strong', { text: r.remitente }), ' te envía un paquete con Vaelo. ', el('span', { class: 'pista', text: 'Guía ' + r.guia })),
      ];
    }
    function datosEnvio(r) {
      return el('div', { class: 'datos' },
        r.referencias ? el('div', {}, el('span', { text: 'Referencias' }), r.referencias) : null,
        el('div', {}, el('span', { text: 'Paquete' }), `${r.vehiculo}${r.descripcion ? '. ' + r.descripcion : ''}${r.fragil ? '. Frágil' : ''}`),
        r.cobro > 0 ? el('div', {}, el('span', { text: 'Pagas al recibir' }), el('strong', { text: dinero(r.cobro) }),
          r.paga_envio ? el('small', { style: 'display:block;color:var(--suave)', text: r.cobro > r.precio_envio ? `Incluye el envío (${dinero(r.precio_envio)}). En efectivo al piloto.` : 'Es el costo del envío. En efectivo al piloto.' }) : null) : null,
        r.programado_para && r.estado === 'pendiente' ? el('div', {}, el('span', { text: 'Recogida programada' }), fechaProgramada(r.programado_para)) : null);
    }

    function pantallaConfirmar(r) {
      let foto = null;
      const vista = el('div', { class: 'selfie-vista', text: 'Sin foto' });
      const entrada = el('input', { type: 'file', accept: 'image/*', 'aria-label': 'Elegir una foto tuya' });
      const etiquetaFoto = el('label', { class: 'boton borde doc-boton' }, 'Elegir foto', entrada);
      const msgFoto = el('small', { class: 'doc-estado' });
      entrada.addEventListener('change', async () => {
        const f = entrada.files[0]; if (!f) return;
        msgFoto.textContent = 'Preparando…'; msgFoto.className = 'doc-estado';
        try {
          foto = await prepararArchivo(f, false);
          vista.replaceChildren(el('img', { src: foto, alt: 'Tu foto' }));
          etiquetaFoto.firstChild.textContent = 'Cambiar foto'; msgFoto.textContent = '';
        } catch (e) { msgFoto.className = 'doc-estado error'; msgFoto.textContent = e.message; }
        entrada.value = '';
      });
      const nombre = el('input', { id: 'nombre', maxlength: 100, value: r.nombre_sugerido || '', autocomplete: 'name' });
      const msg = el('div', { class: 'mensaje', role: 'alert' });
      const boton = el('button', { class: 'boton cinta', type: 'button', style: 'width:100%', text: 'Confirmar y compartir mi ubicación' });
      boton.addEventListener('click', async () => {
        mostrarMensaje(msg, '');
        if (nombre.value.trim().length < 3) return mostrarMensaje(msg, 'Escribe tu nombre completo.');
        boton.disabled = true; boton.textContent = 'Buscando tu ubicación…';
        try {
          const pos = await leerUbicacion();
          ultimaLectura = pos;
          boton.textContent = 'Guardando…';
          await api(API + '/confirmar', { body: { nombre: nombre.value, ...(foto ? { foto } : {}), ...pos } });
          fase = '';
          iniciarUbicacion();
          await cargar();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) { mostrarMensaje(msg, e.message); boton.disabled = false; boton.textContent = 'Confirmar y compartir mi ubicación'; }
      });
      const entrega = r.rol === 'entrega';
      return [
        ...encabezado(r),
        el('div', { class: 'mensaje aviso', text: entrega ? 'Comparte tu ubicación para que el piloto llegue a recoger el paquete a donde estás. Solo toma un minuto.'
          : 'Comparte tu ubicación para que el piloto te lleve el paquete a donde estás. Solo toma un minuto.' }),
        el('div', { class: 'recibe-paso' }, el('h2', { text: '1. Confirma tu nombre' }), el('label', { class: 'oculto', for: 'nombre', text: 'Nombre completo' }), nombre),
        el('div', { class: 'recibe-paso' }, el('h2', {}, '2. Tu foto ', el('span', { class: 'ayuda', text: 'Opcional' })),
          el('p', { class: 'pista', text: 'Si quieres, elige una foto tuya de la galería para que el piloto te reconozca.' }),
          el('div', { class: 'selfie' }, vista, el('div', {}, etiquetaFoto, el('br'), msgFoto))),
        el('div', { class: 'recibe-paso' }, el('h2', { text: '3. Comparte tu ubicación' }),
          el('p', { class: 'pista', text: `Tu ubicación solo la ven el piloto asignado y Vaelo, y se deja de compartir cuando ${entrega ? 'el piloto recoge' : 'recibes'} el paquete. Deja esta página abierta mientras tanto.` }),
          msg, boton),
        datosEnvio(r),
      ];
    }

    function pantallaConfirmado(r) {
      const cajaMapa = el('div', { class: 'mapa alto' });
      const p = r.piloto;
      const tarjeta = p
        ? el('div', { class: 'receptor-piloto' },
            p.tiene_foto ? el('img', { src: API + '/foto-piloto', alt: 'Foto de ' + p.nombre, onerror: (ev) => ev.target.replaceWith(el('div', { class: 'sin-foto-piloto', text: p.nombre.charAt(0) })) }) : el('div', { class: 'sin-foto-piloto', text: p.nombre.charAt(0) }),
            el('div', {}, el('span', { class: 'mini', text: r.rol === 'entrega' ? 'Piloto que viene a recoger' : 'Tu piloto Vaelo' }), el('strong', { style: 'font-size:1.1rem', text: p.nombre }), el('br'),
              [p.vehiculo, p.color].filter(Boolean).join(' · '), ' ', p.placa ? el('span', { class: 'placa', text: p.placa }) : null,
              el('div', { class: 'pista', text: r.rol === 'entrega' ? 'Revisa que la placa coincida antes de entregar el paquete.' : 'Revisa que la placa coincida antes de recibir.' }),
              p.telefono ? el('a', { class: 'boton borde chico', style: 'margin-top:.5rem', href: 'tel:' + String(p.telefono).replace(/[^\d+]/g, ''), text: 'Llamar a ' + p.nombre }) : null))
        : el('div', { class: 'receptor-piloto' }, el('div', { class: 'sin-foto-piloto', text: '?' }),
            el('div', {}, el('strong', { text: 'Asignando piloto' }), el('div', { class: 'pista', text: 'Aquí verás su nombre, foto y placa en cuanto acepte el envío.' })));
      const nodos = [
        ...encabezado(r),
        el('div', { id: 'estado-gps', class: 'en-vivo pausa' }),
        chipEstado(r.estado),
        r.codigo_entrega ? el('div', { class: 'codigo-entrega' }, el('div', {}, el('span', { text: 'Tu código de entrega' }), el('strong', { text: r.codigo_entrega })),
          el('p', { text: 'Dáselo al piloto solo cuando tengas el paquete en tus manos. No lo compartas antes con nadie.' })) : null,
        tarjeta,
        cajaMapa, el('p', { class: 'pista', id: 'nota-mapa' }),
        datosEnvio(r),
        el('p', { class: 'pista', text: `Deja esta página abierta hasta que ${r.rol === 'entrega' ? 'el piloto recoja' : 'recibas'} el paquete. Si la cierras, vuelve a abrir el mismo enlace para seguir compartiendo tu ubicación.` }),
      ];
      return { nodos, cajaMapa };
    }

    function pantallaCerrada(r) {
      if (r.rol === 'entrega' && r.estado !== 'cancelado') return [...encabezado(r),
        el('div', { class: 'mensaje exito', text: 'El piloto ya recogió el paquete. Gracias. Ya no se comparte tu ubicación.' })];
      // El piloto no pudo entregar: quien envía decide si se devuelve o se guarda en la sede
      if (['fallido', 'devolviendo', 'devuelto', 'a_sede', 'en_sede', 'reenviado'].includes(r.estado)) return [...encabezado(r),
        el('div', { class: 'mensaje aviso' }, el('strong', { text: 'No pudimos entregarte el paquete' }), el('br'),
          { fallido: `Le avisamos a ${r.remitente} para que decida qué hacer. Si quieres recibirlo, comunícate con ${r.remitente}.`,
            devolviendo: `El paquete se está devolviendo a ${r.remitente}.`, devuelto: `El paquete se devolvió a ${r.remitente}.`,
            a_sede: 'El paquete va a la sede de Vaelo. Comunícate con quien te lo envió para recogerlo o recibirlo de nuevo.',
            en_sede: 'El paquete está en la sede de Vaelo. Comunícate con quien te lo envió para recogerlo o recibirlo de nuevo.',
            reenviado: 'El paquete va en camino otra vez. Recarga esta página para seguirlo.' }[r.estado])];
      if (r.estado === 'cancelado') return [el('h1', { text: 'Envío cancelado' }), el('p', { text: `${r.remitente} canceló este envío (guía ${r.guia}). Ya no se comparte tu ubicación.` })];
      return [...encabezado(r),
        el('div', { class: 'mensaje exito' }, r.recibio ? `Lo recibió ${r.recibio}` : 'Tu paquete fue entregado', r.entregado_en ? ` el ${fecha(r.entregado_en)}.` : '.', ' Ya no se comparte tu ubicación.'),
        r.puede_calificar ? bloqueCalificar(r) : r.calificacion ? el('p', { class: 'pista ok', text: `Calificaste la entrega con ${r.calificacion} de 5. ¡Gracias!` }) : null,
        el('p', {}, 'Gracias por recibir con Vaelo. ¿Necesitas enviar algo? ', el('a', { href: '/', text: 'Pide tu envío aquí' }), '.')];
    }

    // Calificar al piloto (una vez entregado): ayuda a que los mejores pilotos reciban más envíos
    function bloqueCalificar(r) {
      let estrellas = 0;
      const msg = el('div', { class: 'mensaje', role: 'alert' });
      const comentario = el('textarea', { rows: 2, maxlength: 300, placeholder: 'Opcional: ¿algo que debamos saber?' });
      const botones = [1, 2, 3, 4, 5].map(n => el('button', { type: 'button', 'aria-label': `${n} de 5`, text: '★', onclick: () => { estrellas = n; botones.forEach((b, i) => b.classList.toggle('si', i < n)); } }));
      const caja = el('div', { class: 'bloque calificar-piloto' },
        el('h2', { style: 'font-size:1.15rem;margin:0', text: `¿Cómo te atendió ${r.piloto_nombre || 'el piloto'}?` }),
        el('div', { class: 'estrellas grandes' }, botones), comentario, msg,
        el('button', { class: 'boton', type: 'button', text: 'Enviar calificación', onclick: async (ev) => {
          if (!estrellas) { mostrarMensaje(msg, 'Toca de 1 a 5 estrellas.'); return; }
          ev.target.disabled = true;
          try { await api(API + '/calificar', { body: { estrellas, comentario: comentario.value } }); poner(caja, el('p', { class: 'pista ok', text: '¡Gracias por tu calificación!' })); }
          catch (e) { mostrarMensaje(msg, e.message); ev.target.disabled = false; }
        } }));
      return caja;
    }

    async function cargar() {
      try {
        const r = await api(API);
        datos = r;
        mostrarMensaje($('msg'), '');
        const nueva = !r.activo ? 'cerrado' : r.confirmado ? 'confirmado' : 'confirmar';
        if (nueva !== fase || (nueva === 'confirmado' && (!!r.piloto !== !!marcas._hayPiloto || r.estado !== marcas._estado))) {
          fase = nueva; mapa = null; marcas = {};
          if (fase === 'cerrado') { detenerUbicacion(); $('contenido').replaceChildren(...pantallaCerrada(r)); clearInterval(reloj); return; }
          if (fase === 'confirmar') { $('contenido').replaceChildren(...pantallaConfirmar(r)); return; }
          const { nodos, cajaMapa } = pantallaConfirmado(r);
          $('contenido').replaceChildren(...nodos.filter(Boolean));
          pintarEstadoGps();
          iniciarUbicacion();
          marcas._hayPiloto = !!r.piloto; marcas._estado = r.estado;
          mapa = crearMapa(cajaMapa);
          if (mapa) {
            const puntos = [];
            if (ultimaLectura) puntos.push([ultimaLectura.lat, ultimaLectura.lng]);
            if (r.piloto && r.piloto.lat != null) puntos.push([r.piloto.lat, r.piloto.lng]);
            moverMiPunto(); pintarPiloto(r.piloto);
            mapa.encuadrar(puntos, { margen: 60 });
          }
        } else if (fase === 'confirmado') pintarPiloto(r.piloto);
      } catch (e) {
        if (!datos) { $('contenido').replaceChildren(); clearInterval(reloj); }
        mostrarMensaje($('msg'), e.message);
      }
    }
    cargar();
    reloj = setInterval(() => { if (fase !== 'confirmar') cargar(); }, 12000);
  </script>
</body>
</html>
