<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · Vaelo</title>
  <meta name="description" content="Crea tu cuenta gratis en Vaelo y envía paquetes en moto o pickup en la Ciudad de Guatemala.">
  <meta name="theme-color" content="#0e2463">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=20261111c">
  <link rel="stylesheet" href="/css/suave.css?v=20261111a">
</head>
<body>
  <header id="barra" class="barra"><div class="contenedor"><a href="/" class="marca"><img src="/img/logo-blanco.png" alt="Vaelo" width="139" height="40"></a></div></header>
  <main class="acceso">
    <form class="tarjeta-acceso" id="form" novalidate>
      <h1>Crea tu cuenta</h1>
      <p style="color:var(--suave)">Con tu cuenta envías paquetes y los sigues en el mapa.</p>
      <div id="msg" class="mensaje" role="alert"></div>
      <fieldset class="uso-cuenta">
        <legend>¿Para qué vas a usar Vaelo?</legend>
        <label class="opcion"><input type="radio" name="uso" value="personal" checked><span>Mandar mis paquetes<small>Envíos sueltos para ti o tu familia</small></span></label>
        <label class="opcion"><input type="radio" name="uso" value="tienda"><span>Vendo en lives o redes<small>Mandas todos los pedidos de tu live juntos y cobramos al entregar</small></span></label>
      </fieldset>
      <div class="campo" id="campo-tienda" hidden><label for="tienda">Nombre de tu tienda</label><input id="tienda" maxlength="60" placeholder="Ej. Moda Luna GT"></div>
      <div class="campo"><label for="nombre">Nombre completo</label><input id="nombre" autocomplete="name" required maxlength="100"></div>
      <div class="campo"><label for="telefono">Teléfono o WhatsApp</label><input id="telefono" type="tel" autocomplete="tel" placeholder="0000-0000" required maxlength="30"></div>
      <div class="campo"><label for="email">Correo</label><input id="email" type="email" autocomplete="email" required maxlength="150"></div>
      <div class="campo"><label for="password">Contraseña <span class="ayuda">Mínimo 8 caracteres</span></label><input id="password" type="password" autocomplete="new-password" required minlength="8"></div>
      <label class="casilla" for="terminos"><input type="checkbox" id="terminos" style="width:auto"><span>Acepto los <a href="/terminos" target="_blank">términos del servicio</a> y el <a href="/privacidad" target="_blank">aviso de privacidad</a></span></label>
      <button class="boton" type="submit">Crear cuenta</button>
      <p class="alterno">¿Ya tienes cuenta? <a href="/entrar" id="a-entrar">Entra aquí</a></p>
    </form>
  </main>
  <script src="/js/comun.js?v=20261109c"></script>
  <script src="/js/suave.js?v=20261111a"></script>
  <script>
    pintarBarra();
    const form = document.getElementById('form');
    // ¿Personal o tienda? Desde el inicio (/registro?tienda=1) ya viene elegida la tienda
    const pintarUso = () => { const t = form.querySelector('input[name=uso]:checked').value === 'tienda'; document.getElementById('campo-tienda').hidden = !t; };
    form.querySelectorAll('input[name=uso]').forEach((x) => x.addEventListener('change', pintarUso));
    if (new URLSearchParams(location.search).get('tienda')) { form.querySelector('input[name=uso][value=tienda]').checked = true; pintarUso(); }
    const volverR = new URLSearchParams(location.search).get('volver') || '';
    if (/^\/[a-z-]*$/.test(volverR)) document.getElementById('a-entrar').href = '/entrar?volver=' + encodeURIComponent(volverR);
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const boton = form.querySelector('button');
      boton.disabled = true;
      try {
        await api('/api/registro', { body: {
          nombre: form.nombre.value, telefono: form.telefono.value,
          email: form.email.value, password: form.password.value, acepto_terminos: form.terminos.checked,
          tienda: form.querySelector('input[name=uso]:checked').value === 'tienda' ? (form.tienda.value || '').trim() || ' ' : undefined,
        } });
        const volver = new URLSearchParams(location.search).get('volver') || '';
        location.href = /^\/[a-z-]*$/.test(volver) ? volver : form.querySelector('input[name=uso]:checked').value === 'tienda' ? '/tienda' : '/enviar';
      } catch (e) {
        mostrarMensaje(document.getElementById('msg'), e.message);
        boton.disabled = false;
      }
    });
  </script>
</body>
</html>
