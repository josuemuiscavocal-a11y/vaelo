<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Entrar · Vaelo</title>
  <meta name="theme-color" content="#0e2463">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=20261109b">
  <link rel="stylesheet" href="/css/suave.css?v=20261111a">
</head>
<body>
  <header id="barra" class="barra"><div class="contenedor"><a href="/" class="marca"><img src="/img/logo-blanco.png" alt="Vaelo" width="139" height="40"></a></div></header>
  <main class="acceso">
    <form class="tarjeta-acceso" id="form" novalidate>
      <h1>Entra a tu cuenta</h1>
      <p id="pide-cuenta" class="mensaje aviso" hidden>Para enviar un paquete necesitas una cuenta. Entra o crea una gratis.</p>
      <div id="msg" class="mensaje" role="alert"></div>
      <div class="campo"><label for="email">Correo</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="campo"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="boton" type="submit">Entrar</button>
      <p class="alterno"><a href="/recuperar">¿Olvidaste tu contraseña?</a></p>
      <p class="alterno">¿No tienes cuenta? <a href="/registro" id="a-registro">Crea una gratis</a></p>
    </form>
  </main>
  <script src="/js/comun.js?v=20261109c"></script>
  <script src="/js/suave.js?v=20261111a"></script>
  <script>
    pintarBarra();
    const form = document.getElementById('form');
    const volver = new URLSearchParams(location.search).get('volver') || '';
    const volverValido = /^\/[a-z-]*$/.test(volver) ? volver : '';
    if (volverValido) {
      document.getElementById('a-registro').href = '/registro?volver=' + encodeURIComponent(volverValido);
      if (volverValido === '/enviar') document.getElementById('pide-cuenta').hidden = false;
    }
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const boton = form.querySelector('button');
      boton.disabled = true;
      try {
        const r = await api('/api/login', { body: { email: form.email.value, password: form.password.value } });
        location.href = r.rol === 'mensajero' ? '/modomensajero' : (volverValido || '/mi-cuenta');
      } catch (e) {
        mostrarMensaje(document.getElementById('msg'), e.message);
        boton.disabled = false;
      }
    });
  </script>
</body>
</html>
