<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rastrear envío · Vaelo</title>
  <meta name="description" content="Rastrea tu envío de Vaelo con tu número de guía y mira a tu piloto en el mapa en tiempo real.">
  <meta name="theme-color" content="#0e2463">
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css?v=4.7.1">
  <link rel="stylesheet" href="/css/styles.css?v=20261111d">
  <link rel="stylesheet" href="/css/suave.css?v=20261111a">
</head>
<body>
  <header id="barra" class="barra"><div class="contenedor"><a href="/" class="marca"><img src="/img/logo-blanco.png" alt="Vaelo" width="139" height="40"></a></div></header>
  <main class="rastreo">
    <div class="contenedor">
      <h1 style="font-size:clamp(1.9rem,4vw,2.8rem)">Rastrea tu envío</h1>
      <form id="form">
        <label class="oculto" for="guia">Número de guía</label>
        <input id="guia" name="guia" placeholder="VA-7K3M9QX2" autocomplete="off" required maxlength="20">
        <button class="boton" type="submit">Rastrear</button>
      </form>
      <div id="msg" class="mensaje" role="alert"></div>
      <div id="resultado" class="resultado" aria-live="polite"></div>
      <p class="pista" style="max-width:640px;margin-top:1.5rem">¿Enviaste este paquete? <a href="/mi-cuenta">Entra a tu cuenta</a> para verlo en el mapa.</p>
    </div>
  </main>
  <script src="/vendor/maplibre/maplibre-gl.js?v=4.7.1"></script>
  <script src="/js/comun.js?v=20261109c"></script>
  <script src="/js/suave.js?v=20261111a"></script>
  <script>
    pintarBarra();
    const PASOS = ['pendiente', 'recogido', 'en_camino', 'entregado'];
    const ETIQUETAS = ['Solicitado', 'Recogido', 'En camino', 'Entregado'];
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const out = document.getElementById('resultado');

    let reloj = null, mapa = null, marcaPiloto = null, guiaActual = '';
    // El mapa con el piloto se actualiza solo cada 15 segundos mientras el envío va en camino
    async function actualizarPiloto() {
      try {
        const r = await api('/api/rastreo/' + encodeURIComponent(guiaActual));
        if (r.piloto && r.piloto.lat != null && mapa) {
          if (marcaPiloto) marcaPiloto.mover(r.piloto.lat, r.piloto.lng);
          else marcaPiloto = mapa.marcador(r.piloto.lat, r.piloto.lng, { html: htmlPiloto(), ancla: 'center', popup: `${r.piloto.nombre} · ${r.piloto.vehiculo || ''}` });
          document.getElementById('actualizado').textContent = 'Ubicación del piloto actualizada ' + fecha(r.piloto.actualizado);
        }
        if (!r.piloto || r.estado === 'entregado') { clearInterval(reloj); if (r.estado === 'entregado') buscar(guiaActual); }
      } catch { /* se reintenta */ }
    }

    async function buscar(guia) {
      clearInterval(reloj); mapa = null; marcaPiloto = null;
      guia = guia.trim().toUpperCase().replace(/\s+/g, '');
      if (!guia) return;
      if (!guia.startsWith('VA-') && /^[A-Z0-9]{8}$/.test(guia)) guia = 'VA-' + guia;
      form.guia.value = guia;
      history.replaceState(null, '', '/rastreo?guia=' + encodeURIComponent(guia));
      mostrarMensaje(msg, '');
      out.replaceChildren();
      try {
        const r = await api('/api/rastreo/' + encodeURIComponent(guia));
        const idx = PASOS.indexOf(r.estado);
        const nodos = [
          el('div', { class: 'encabezado' },
            el('div', {}, el('div', { class: 'guia', text: r.guia }),
              el('div', { style: 'color:var(--suave)', text: `${r.vehiculo}: ${r.origen_zona || ''} a ${r.destino_zona || ''}${r.destinatario ? ', para ' + r.destinatario : ''}` })),
            chipEstado(r.estado)),
        ];
        if (r.estado !== 'cancelado') nodos.push(barraPasos(r.estado));
        if (r.programado_para && r.estado === 'pendiente') nodos.push(el('p', { class: 'mensaje aviso', text: 'Recogida programada: ' + fechaProgramada(r.programado_para) }));
        let cajaMapa = null;
        if (r.piloto) {
          nodos.push(el('div', { class: 'tarjeta-piloto' }, el('div', { class: 'sin-foto-piloto', text: r.piloto.nombre.charAt(0) }),
            el('div', {}, el('span', { class: 'mini', text: 'Tu piloto' }), el('strong', { text: r.piloto.nombre }), el('br'),
              [r.piloto.vehiculo, r.piloto.color].filter(Boolean).join(' · '), ' ', r.piloto.placa ? el('span', { class: 'placa', text: r.piloto.placa }) : '')));
        }
        if (r.piloto || r.destino_lat != null) {
          cajaMapa = el('div', { class: 'mapa alto' });
          nodos.push(cajaMapa, el('p', { class: 'pista', id: 'actualizado' }));
        }
        nodos.push(el('h2', { style: 'font-size:1.15rem', text: 'Historial' }));
        nodos.push(el('ol', { class: 'linea-tiempo' }, r.eventos.slice().reverse().map(ev =>
          el('li', {}, el('strong', { text: ESTADOS[ev.estado] || ev.estado }), ev.nota ? el('div', { text: ev.nota }) : null, el('small', { text: fecha(ev.creado) })))));
        out.replaceChildren(...nodos);
        guiaActual = r.guia;
        if (cajaMapa) {
          mapa = crearMapa(cajaMapa);
          if (mapa) {
            const puntos = [];
            if (r.destino_lat != null) { mapa.marcador(r.destino_lat, r.destino_lng, { html: htmlPin('B', 'entrega'), popup: 'Punto de entrega' }); puntos.push([r.destino_lat, r.destino_lng]); }
            if (r.piloto && r.piloto.lat != null) {
              marcaPiloto = mapa.marcador(r.piloto.lat, r.piloto.lng, { html: htmlPiloto(), ancla: 'center', popup: `${r.piloto.nombre} · ${r.piloto.vehiculo || ''}` });
              puntos.push([r.piloto.lat, r.piloto.lng]);
              document.getElementById('actualizado').textContent = 'Ubicación del piloto actualizada ' + fecha(r.piloto.actualizado);
            }
            mapa.encuadrar(puntos);
          }
          if (r.piloto) reloj = setInterval(actualizarPiloto, 15000);
        }
      } catch (e) { mostrarMensaje(msg, e.message); }
    }
    form.addEventListener('submit', (ev) => { ev.preventDefault(); buscar(form.guia.value); });
    const inicial = new URLSearchParams(location.search).get('guia');
    if (inicial) buscar(inicial);
  </script>
</body>
</html>
